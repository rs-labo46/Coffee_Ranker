name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: coffeepassword
          POSTGRES_DB: mydb
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U coffee -d mydb -h localhost -p 5432"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      GO_ENV: test
      PORT: 8080

      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffeepassword
      POSTGRES_DB: mydb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5435
      POSTGRES_SSLMODE: disable

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
      TEST_REDIS_ADDR: localhost:6379

      JWT_SECRET: ci-test-jwt-secret-value-for-github-actions-only-do-not-use-in-production
      IP_HASH_SECRET: ci-test-ip-hash-secret-value-for-github-actions-only-do-not-use-in-production
      FE_URL: http://localhost:3000

      SEED_ADMIN_EMAIL: admin@test.com
      SEED_ADMIN_PASSWORD: AdminPassword123!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Check Go format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./... -count=1

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
