name: coffee-ranker

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffeepassword
      POSTGRES_DB: mydb
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d mydb -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: coffee-ranker-redis
    restart: always
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee-ranker-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GO_ENV: "dev"

      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffeepassword
      POSTGRES_DB: mydb
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      JWT_SECRET: ${JWT_SECRET}
      API_DOMAIN: ${API_DOMAIN}
      FE_URL: ${FE_URL}

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffee-ranker-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  frontend_node_modules:
